<html lang="tr">

<title>Sohbet</title>
<style>
:root{--bg:#eef1f7;--panel:#fff;--ink:#1c2233;--mute:#6b7388;--me:#3b4fd8;--me-ink:#fff;--other:#e3e8f3;--line:#d7dcea}
@media(prefers-color-scheme:dark){:root{--bg:#12151f;--panel:#1b2030;--ink:#e8ebf5;--mute:#8f97ad;--me:#5468f0;--other:#272d42;--line:#2c3350}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.screen{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}
#join{align-items:center;justify-content:center;padding:24px}
#join form{width:100%;max-width:340px;background:var(--panel);padding:24px;border-radius:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 4px;font-size:1.5rem}
label{font-size:.85rem;color:var(--mute)}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
button{font:inherit;border:0;border-radius:10px;padding:12px 18px;background:var(--me);color:var(--me-ink);cursor:pointer}
#warn{color:#c0392b;font-size:.9rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:1.05rem}
header span{color:var(--mute);font-size:.85rem}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--other);align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--me);color:var(--me-ink);align-self:flex-end}
